<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Services - PDF Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
        }
        
        /* Custom Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden text-slate-200">

    <!-- Background Animated Glow Orbs for "Stunning" visual effect -->
    <div class="absolute w-full h-full inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-md p-6">
        
        <!-- Glassmorphism Card -->
        <div class="glass-card rounded-2xl shadow-2xl p-8 transition-all duration-500 relative overflow-hidden">
            
            <!-- Top decorative line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500"></div>

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)] tracking-wide">
                    Temp Services
                </h1>
                <p class="text-sm text-slate-400 mt-2">Generate your Excel workbook (including all practicals and assignments) in a PDF format by simply entering your Name and Enrollment Number</p>
            </div>

            <!-- Form -->
            <form id="pdfForm" class="space-y-6">
                <div id="formInputs" class="space-y-5 transition-opacity duration-300">
                    <!-- Name Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1" for="userName">Full Name</label>
                        <div class="relative flex items-center">
                            <div class="absolute left-4 text-slate-400">
                                <!-- User Icon SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <input type="text" id="userName" required autocomplete="off"
                                class="w-full bg-slate-900/50 border border-slate-600 rounded-xl py-3 pl-12 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all"
                                placeholder="Enter your name">
                        </div>
                    </div>

                    <!-- Enrollment No Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1" for="enrollmentNo">Enrollment No.</label>
                        <div class="relative flex items-center">
                            <div class="absolute left-4 text-slate-400">
                                <!-- Badge/ID Icon SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
                                </svg>
                            </div>
                            <input type="text" id="enrollmentNo" required autocomplete="off"
                                class="w-full bg-slate-900/50 border border-slate-600 rounded-xl py-3 pl-12 pr-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all"
                                placeholder="e.g., 202103103510">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="generateBtn" 
                    class="w-full relative group overflow-hidden bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.5)] transition-all duration-300 flex justify-center items-center gap-2">
                    <!-- Button Glow Effect -->
                    <div class="absolute inset-0 w-full h-full bg-white/20 transform -translate-x-full group-hover:translate-x-full transition-transform duration-500 ease-out"></div>
                    
                    <span id="btnText">Generate PDF</span>
                    
                    <!-- Loading Spinner (Hidden by default) -->
                    <svg id="spinner" class="animate-spin hidden h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <!-- Success Section & Download Button (Hidden initially) -->
            <div id="resultSection" class="hidden mt-6 text-center animate-[fadeIn_0.5s_ease-out]">
                <div class="flex justify-center mb-3">
                    <div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
                <h3 class="text-lg font-medium text-emerald-400 mb-1">Process Completed!</h3>
                <p class="text-sm text-slate-400 mb-6">Your requested document has been generated by the server.</p>
                
                <button id="downloadBtn" onclick="triggerDownload()"
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all duration-300 flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Download Your PDF
                </button>
                
                <button onclick="resetForm()" class="mt-4 text-sm text-slate-400 hover:text-cyan-400 transition-colors underline-offset-4 hover:underline">
                    Create another one
                </button>
            </div>
            
        </div>
    </main>

    <script>
        
let generatedPdf = null;
let generatedFilename = "TempServices.pdf";

document.getElementById("pdfForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("userName").value.trim();
    const enrollment = document.getElementById("enrollmentNo").value.trim();

    const formInputs = document.getElementById("formInputs");
    const generateBtn = document.getElementById("generateBtn");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
    const resultSection = document.getElementById("resultSection");

    if (!name || !enrollment) {
        alert("Please enter your name and enrollment number.");
        return;
    }

    generatedPdf = null;
    generateBtn.disabled = true;
    btnText.innerText = "Generating PDF...";
    spinner.classList.remove("hidden");
    generateBtn.classList.add("opacity-80");
    formInputs.classList.add("opacity-50", "pointer-events-none");

    try {
        const response = await fetch("/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                enrollment: enrollment
            })
        });

        if (!response.ok) {
            let message = "PDF generate na thai. Please try again.";

            try {
                const errorData = await response.json();
                if (errorData.error) message = errorData.error;
            } catch (_) {}

            throw new Error(message);
        }

        generatedPdf = await response.blob();

        if (generatedPdf.size === 0) {
            throw new Error("Server e empty PDF mokli chhe.");
        }

        generatedFilename =
            "TempServices_" +
            enrollment.replace(/[^A-Za-z0-9_-]/g, "_") +
            ".pdf";

        formInputs.classList.add("hidden");
        generateBtn.classList.add("hidden");
        resultSection.classList.remove("hidden");

    } catch (error) {
        alert(error.message || "Server sathe connection nathi thatu.");
        formInputs.classList.remove("opacity-50", "pointer-events-none");
    } finally {
        generateBtn.disabled = false;
        generateBtn.classList.remove("opacity-80");
        btnText.innerText = "Generate PDF";
        spinner.classList.add("hidden");
    }
});

function triggerDownload() {
    if (!generatedPdf) {
        alert("Please generate your PDF first.");
        return;
    }

    const url = URL.createObjectURL(generatedPdf);
    const link = document.createElement("a");

    link.href = url;
    link.download = generatedFilename;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function resetForm() {
    generatedPdf = null;

    document.getElementById("pdfForm").reset();
    document.getElementById("resultSection").classList.add("hidden");

    const formInputs = document.getElementById("formInputs");
    formInputs.classList.remove(
        "hidden", "opacity-50", "pointer-events-none"
    );

    const generateBtn = document.getElementById("generateBtn");
    generateBtn.classList.remove("hidden");
    generateBtn.disabled = false;

    document.getElementById("btnText").innerText = "Generate PDF";
    document.getElementById("spinner").classList.add("hidden");
}
    </script>
</body>
</html>
